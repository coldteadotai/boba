name: Boba
description: Run your Playwright suite on Coldtea Boba and get one check on your commit or pull request, with each failure annotated on the line that failed.
author: Coldtea
branding:
  icon: check-circle
  color: gray-dark
inputs:
  api-url:
    description: Boba's address. You don't need it on runs-on coldtea-boba, where the runner knows it.
    default: ""
  api-token:
    description: You don't need it on runs-on coldtea-boba, where Boba gives each job its own token. Boba keeps it for workflows written before Boba had its own runners.
    default: ""
  secrets:
    description: You don't need it on runs-on coldtea-boba, where the runner already lists the job's secrets. On an older runner image, pass toJSON(secrets) here so Boba can keep your secrets out of everything it stores and publishes.
    default: ""
  github-token:
    description: Boba uses it only with api-token, to post the check run and the pull request comment. On runs-on coldtea-boba, Boba posts both with its GitHub App.
    default: ${{ github.token }}
  project:
    description: The Playwright project to run. Leave it empty and Boba runs every project.
    default: ""
  config:
    description: The Playwright config file, relative to the checkout, when you named it something other than playwright.config. You pass the same file to playwright test -c.
    default: ""
  working-directory:
    description: The folder that holds the suite's playwright.config, relative to the checkout. Set it only when your repository has several configs.
    default: ""
  turbo:
    description: "true runs the suite on Turbo, the fastest tier. false runs it on Standard, the lowest price per run."
    default: "false"
  playwright-args:
    description: Extra arguments Boba passes to playwright test. Separate them with spaces.
    default: ""
  suites:
    description: |
      Only for a job with more than one Playwright test step: list those steps' runs here, as a YAML list, and one Boba step runs them all and posts one check with a section for each. Each item takes config, args, env (Boba adds it to the step's environment) and an optional name. Boba runs the step's own config and playwright-args as one more suite. Leave it out for a job with one Playwright step.
    default: ""
  fail-fast:
    description: On a pull request, true stops at the first test that still fails after its retries, and the check says how many tests didn't run. false runs the whole suite. On pushes and merge queues Boba always runs the whole suite.
    default: "true"
  timeout-minutes:
    description: How many minutes the step waits for results.
    default: "60"
  check-name:
    description: The name Boba gives the check run.
    default: Boba
  post:
    description: Set it to false and Boba prints the check instead of posting it.
    default: "true"
  job-id:
    description: Attaches the step to a Boba job that already exists, so Boba doesn't start a new one.
    default: ""
runs:
  using: node24
  main: dist/index.js
